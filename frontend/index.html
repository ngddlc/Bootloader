<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeCloud Downloader</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Пользовательские стили и анимации -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <!-- Шапка приложения -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-10 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">HomeCloud</h1>
                <p class="text-xs text-slate-400">Многопоточный менеджер загрузок</p>
            </div>
        </div>
        <div id="statsBadge" class="text-xs bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">
            Загрузок в истории: <span id="totalTasksCount" class="font-bold text-blue-400">0</span>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-6 space-y-6">

        <!-- Панель добавления новой ссылки -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 shadow-xl">
            <form id="downloadForm" class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="url" id="urlInput" required
                           placeholder="Вставьте ссылку на файл (https://...)" 
                           class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 pl-10 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-500 text-slate-100 transition">
                    <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                    </svg>
                </div>

                <!-- Кнопка выбора папки: по умолчанию "Папка: Авто" -->
                <button type="button" id="folderBtn" title="Нажмите, чтобы выбрать папку (по умолчанию автоматически по категориям)"
                        class="bg-slate-950 hover:bg-slate-800 active:scale-95 text-slate-300 font-medium px-4 py-3 rounded-xl text-sm transition flex items-center gap-2 border border-slate-700 shrink-0">
                    <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                    </svg>
                    <span id="folderLabel" class="truncate max-w-[130px]">Папка: Авто</span>
                </button>

                <!-- Выбор количества потоков -->
                <div class="relative shrink-0">
                    <select id="threadsSelect" title="Количество параллельных потоков HTTP Range"
                            class="bg-slate-950 hover:bg-slate-800 text-slate-300 font-medium px-3.5 py-3 rounded-xl text-sm transition border border-slate-700 focus:outline-none focus:border-blue-500 cursor-pointer appearance-none pr-8">
                        <option value="2">⚡ 2 потока</option>
                        <option value="4">⚡ 4 потока</option>
                        <option value="8" selected>⚡ 8 потоков</option>
                        <option value="16">⚡ 16 потоков</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-400">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                </div>

                <button type="submit" id="submitBtn" 
                        class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium px-6 py-3 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    Скачать
                </button>
            </form>
        </div>

        <!-- Список загрузок -->
        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider px-1">Список задач</h2>
            
            <div id="tasksList" class="space-y-3">
                <!-- Сюда динамически добавляются карточки задач -->
            </div>

            <!-- Заглушка, если список пуст -->
            <div id="emptyState" class="hidden text-center py-12 border border-dashed border-slate-800 rounded-2xl">
                <svg class="w-12 h-12 text-slate-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                </svg>
                <p class="text-slate-400 font-medium text-sm">История загрузок пуста</p>
                <p class="text-slate-600 text-xs mt-1">Вставьте ссылку выше, чтобы запустить скачивание</p>
            </div>
        </div>
    </main>

    <!-- Модальное окно подтверждения удаления задачи -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-fadeIn">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-rose-500/10 text-rose-400 rounded-xl border border-rose-500/20 shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </div>
                <div class="overflow-hidden">
                    <h3 class="text-base font-semibold text-slate-100">Удаление задачи</h3>
                    <p id="deleteModalFilename" class="text-xs text-slate-400 truncate font-mono">Файл</p>
                </div>
            </div>

            <p class="text-sm text-slate-300">
                Как вы хотите удалить эту загрузку?
            </p>

            <div class="flex flex-col gap-2 pt-2">
                <button type="button" onclick="confirmDelete(false)"
                        class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 active:scale-[0.98] text-slate-200 text-sm font-medium rounded-xl transition border border-slate-700 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    <span>Удалить только из списка</span>
                </button>

                <button type="button" onclick="confirmDelete(true)"
                        class="w-full py-2.5 px-4 bg-rose-500/10 hover:bg-rose-500/20 active:scale-[0.98] text-rose-300 text-sm font-medium rounded-xl transition border border-rose-500/30 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                    <span>Удалить вместе с файлом на диске</span>
                </button>

                <button type="button" onclick="closeDeleteModal()"
                        class="w-full py-2 text-slate-400 hover:text-slate-200 text-xs font-medium rounded-xl transition">
                    Отмена
                </button>
            </div>
        </div>
    </div>

    <!-- Клиентская логика приложения -->
    <script src="app.js"></script>
</body>
</html>
